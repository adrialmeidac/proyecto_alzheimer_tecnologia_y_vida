<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Publicación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/color.css"> <!-- Variables -->
    <link rel="stylesheet" href="./assets/css/global.css"> <!-- Estilos globales -->
    <link rel="stylesheet" href="./assets/css/header.css"> <!-- Header -->
    <link rel="stylesheet" href="./assets/css/footer.css"> <!-- Footer -->
    <link rel="stylesheet" href="./assets/css/nuevo-post.css"> <!-- Estilos propios de nuevo post -->

</head>
<script src="./assets/js/theme.js"></script>

<body>

    <!-- HEADER -->
    <header class="header">
        <button class="theme-toggle" onclick="toggleTheme()">Modo oscuro</button>
        <h1>Nueva Publicación</h1>
        <p class="subtitle">Comparte tus ideas o experiencias</p>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="newpost-container">

        <section class="newpost-section">

            <form id="postForm" class="newpost-form" action="#" method="POST">

                <label for="titulo" class="form-label">Título</label>
                <input type="text" id="titulo" name="titulo" class="form-input" placeholder="Escribe un título..."
                    required autocomplete="off">

                <label for="contenido" class="form-label">Contenido</label>
                <textarea id="contenido" name="contenido" class="form-textarea" placeholder="Escribe tu mensaje..."
                    required autocomplete="off"></textarea>

                <button type="submit" class="main-btn">Publicar</button>

            </form>

        </section>

    </main>
    <!-- BOTÓN VOLVER -->
    <div class="text-center mt-4">
        <button class="btn btn-secondary px-4 py-2" onclick="location.href='dashboard.html'">Volver</button>
    </div>

    <!-- FOOTER -->

    <footer class="footer">
        <div class="footer-section">
            <h4>Contactos</h4>
            <ul>
                <li><a href="contactos.html">Contactos generales</a></li>
                <li><a href="contactos-medicos.html">Contactos médicos</a></li>
                <li><a href="faq.html">Preguntas frecuentes</a></li>
            </ul>
        </div>

        <div class="footer-section">
            <h4>Información legal</h4>
            <ul>
                <li><a href="politicas-de-privacidad.html">Políticas de privacidad</a></li>
                <li><a href="aviso-legal.html">Aviso legal</a></li>
                <li><a href="politicas-de-cookies.html">Políticas de cookies</a></li>
                <li><a href="accesibilidad.html">Accesibilidad</a></li>
            </ul>
        </div>
    </footer>

    <!-- JS -->
    <script src="./assets/js/nuevo-post.js"></script>

</body>

</html>
