<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/color.css">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/footer.css">
    <link rel="stylesheet" href="./assets/css/memoria.css">
    <link rel="stylesheet" href="./assets/css/timer.css">
</head>

<script src="./assets/js/theme.js"></script>

<body>

    <!-- HEADER -->
    <header class="header">
        <button class="theme-toggle" onclick="toggleTheme()">Modo oscuro</button>
        <h1>Juego de Memoria</h1>
        <p class="subtitle">Encuentra las parejas iguales</p>
    </header>

    <!-- TEMPORIZADOR -->
    <p id="timer" class="timer">Tiempo: 0s</p>

    <!-- DIFICULTAD -->
    <div class="difficulty-row">
        <label class="difficulty-option">
            <input type="radio" name="difficulty" value="facil">
            Fácil
        </label>

        <label class="difficulty-option">
            <input type="radio" name="difficulty" value="medio" checked>
            Medio
        </label>

        <label class="difficulty-option">
            <input type="radio" name="difficulty" value="dificil">
            Difícil
        </label>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="memory-container">
        <section id="grid" class="memory-grid" aria-label="Tablero del juego de memoria"></section>
    </main>

    <!-- BOTONES -->
    <div class="text-center mt-4">
        <button id="resetBtn" class="btn btn-warning px-4 py-2">Reiniciar</button>
        <button class="btn btn-secondary px-4 py-2" onclick="location.href='dashboard.html'">Volver</button>
    </div>

    <!-- FOOTER -->
    <footer class="footer mt-5">
        <div class="footer-section">
            <h4>Contactos</h4>
            <ul>
                <li><a href="contactos.html">Contactos generales</a></li>
                <li><a href="contactos-medicos.html">Contactos médicos</a></li>
                <li><a href="faq.html">Preguntas frecuentes</a></li>
            </ul>
        </div>

        <div class="footer-section">
            <h4>Información legal</h4>
            <ul>
                <li><a href="politicas-de-privacidad.html">Políticas de privacidad</a></li>
                <li><a href="aviso-legal.html">Aviso legal</a></li>
                <li><a href="politicas-de-cookies.html">Políticas de cookies</a></li>
                <li><a href="accesibilidad.html">Accesibilidad</a></li>
            </ul>
        </div>
    </footer>

    <!-- JS -->
    <script src="./assets/js/memoria.js"></script>

</body>
</html>
