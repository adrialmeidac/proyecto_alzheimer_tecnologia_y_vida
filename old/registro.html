<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/color.css"> <!-- Variables -->
    <link rel="stylesheet" href="./assets/css/global.css"> <!-- Estilos globales -->
    <link rel="stylesheet" href="./assets/css/header.css"> <!-- Header -->
    <link rel="stylesheet" href="./assets/css/footer.css"> <!-- Footer -->
    <link rel="stylesheet" href="./assets/css/registro.css"> <!-- Estilos propios de registro -->


    <!-- reCAPTCHA v2 invisible -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<script src="./assets/js/theme.js"></script>

<body class="register-body">
    <header><button class="theme-toggle" onclick="toggleTheme()">Modo oscuro</button>
    </header>

    <div class="page-wrapper">

        <!-- Botón volver al index-->
        <button class="back-btn-register" onclick="location.href='index.html'">Volver al inicio</button>

        <main class="register-container">

            <div class="register-card">

                <h2>Crear cuenta</h2>
                <p class="register-subtitle">Completa los datos para registrarte</p>

                <!-- Caja de errores -->
                <div id="register-errors" class="register-errors" style="display:none;"></div>

                <!-- Formulario -->
                <form id="registerForm" class="register-form" novalidate>

                    <label for="name">Nombre completo</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        required 
                        placeholder="Introduce tu nombre"
                        autocomplete="name"
                    >

                    <label for="email">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                    >

                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="new-password"
                    >

                    <label for="password2">Confirmar contraseña</label>
                    <input 
                        type="password" 
                        id="password2" 
                        name="password2" 
                        required 
                        placeholder="Repite la contraseña"
                        autocomplete="new-password"
                    >

                    <!-- Botón con reCAPTCHA invisible -->
                    <button 
                        class="register-btn g-recaptcha"
                        data-sitekey="6LfK5ZUsAAAAAGVIbbqrEHcRRXmhe7Z5yABCKYzO"
                        data-callback="onSubmit"
                        data-action="submit"
                        type="submit"
                    >
                        Registrarme
                    </button>

                    <p class="register-login">
                        ¿Ya tienes cuenta?
                        <a href="login.html">Inicia sesión</a>
                    </p>

                </form>

            </div>

        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="footer-section">
                <h4>Contactos</h4>
                <ul>
                    <li><a href="contactos.html">Contactos generales</a></li>
                    <li><a href="contactos-medicos.html">Contactos médicos</a></li>
                    <li><a href="faq.html">Preguntas frecuentes</a></li>
                </ul>
            </div>

            <div class="footer-section">
                <h4>Información legal</h4>
                <ul>
                    <li><a href="politicas-de-privacidad.html">Políticas de privacidad</a></li>
                    <li><a href="aviso-legal.html">Aviso legal</a></li>
                    <li><a href="politicas-de-cookies.html">Políticas de cookies</a></li>
                    <li><a href="accesibilidad.html">Accesibilidad</a></li>
                </ul>
            </div>
        </footer>

    </div>

    <!-- JS externo -->
    <script src="../assets/js/registro.js"></script>

</body>
</html>
