<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades Diarias</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/color.css">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/footer.css">
    <link rel="stylesheet" href="./assets/css/actividades.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400&display=swap" rel="stylesheet">
</head>

<script src="./assets/js/theme.js"></script>

<body>

    <!-- HEADER -->
    <header class="header">
        <button class="theme-toggle" onclick="toggleTheme()">Modo oscuro</button>
        <h1>Actividades Diarias</h1>
        <p class="subtitle">Marca las actividades que realizaste hoy</p>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mt-4">

        <!-- BOTÓN PARA AÑADIR ACTIVIDAD -->
        <div class="text-center mb-4">
            <button id="addActivityBtn" class="btn btn-success px-4 py-2">Añadir actividad</button>
        </div>

        <form id="actividadesForm" class="activities-form">

            <!-- CONTENEDOR DINÁMICO -->
            <div id="activitiesList" class="row gy-4">

                <!-- EJEMPLO DE ACTIVIDAD -->
                <div class="col-12">
                    <div class="activity-item p-3 border rounded shadow-sm">

                        <!-- Checkbox principal -->
                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input actividad-check" id="actividad1">
                            <label class="form-check-label" for="actividad1">
                                Tomar medicinas
                            </label>
                        </div>

                        <!-- Opciones -->
                        <div class="row g-3 activity-options">

                            <div class="col-12 col-md-6">
                                <label class="form-label">Hora límite:</label>
                                <input type="time" class="form-control actividad-hora">
                            </div>

                            <div class="col-12 col-md-6 d-flex align-items-center">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input actividad-notif" id="notif1">
                                    <label class="form-check-label" for="notif1">
                                        Notificar si no se realiza
                                    </label>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>

            </div>

            <!-- BOTÓN GUARDAR -->
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-success px-4 py-2">Guardar Actividades</button>
            </div>

        </form>

    </main>

    <!-- BOTÓN VOLVER -->
    <div class="text-center mt-4">
        <button class="btn btn-secondary px-4 py-2" onclick="location.href='dashboard.html'">Volver</button>
    </div>

    <!-- FOOTER -->
    <footer class="footer mt-5">
        <div class="footer-section">
            <h4>Contactos</h4>
            <ul>
                <li><a href="contactos.html">Contactos generales</a></li>
                <li><a href="contactos-medicos.html">Contactos médicos</a></li>
                <li><a href="faq.html">Preguntas frecuentes</a></li>
            </ul>
        </div>

        <div class="footer-section">
            <h4>Información legal</h4>
            <ul>
                <li><a href="politicas-de-privacidad.html">Políticas de privacidad</a></li>
                <li><a href="aviso-legal.html">Aviso legal</a></li>
                <li><a href="politicas-de-cookies.html">Políticas de cookies</a></li>
                <li><a href="accesibilidad.html">Accesibilidad</a></li>
            </ul>
        </div>
    </footer>

    <!-- JS -->
    <script src="./assets/js/actividades.js"></script>

</body>

</html>
