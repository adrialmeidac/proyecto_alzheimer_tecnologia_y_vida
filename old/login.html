<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/color.css"> <!-- Variables -->
    <link rel="stylesheet" href="./assets/css/global.css"> <!-- Estilos globales -->
    <link rel="stylesheet" href="./assets/css/header.css"> <!-- Header -->
    <link rel="stylesheet" href="./assets/css/footer.css"> <!-- Footer -->
    <link rel="stylesheet" href="./assets/css/login.css"> <!-- Estilos propios de login -->

  
    <title>Iniciar sesión</title>
</head>
<script src="./assets/js/theme.js"></script>

<body>
    <header><button class="theme-toggle" onclick="toggleTheme()">Modo oscuro</button>
    </header>

    <main class="login-container">

        <h2>Iniciar sesión</h2>

        <form id="loginForm" class="login-form" action="#" method="POST">

            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                name="email"
                required 
                autocomplete="email"
                placeholder="Introduce tu correo"
            >

            <label for="password">Contraseña</label>
            <input 
                type="password" 
                id="password" 
                name="password"
                required 
                autocomplete="current-password"
                placeholder="Introduce tu contraseña"
            >

            <button type="submit" class="main-btn">Entrar</button>
        </form>

        <p class="register-link">
            ¿No tienes cuenta?
            <a href="./registro.html" class="register-a">Regístrate</a>
        </p>
        <br>
        </main>
    <button class="back-btn" onclick="location.href='index.html'">Volver al inicio</button>
     <!-- FOOTER -->
        
    <footer class="footer">
        <div class="footer-section">
            <h4>Contactos</h4>
            <ul>
                <li><a href="contactos.html">Contactos generales</a></li>
                <li><a href="contactos-medicos.html">Contactos médicos</a></li>
                <li><a href="faq.html">Preguntas frecuentes</a></li>
            </ul>
        </div>

        <div class="footer-section">
            <h4>Información legal</h4>
            <ul>
                <li><a href="politicas-de-privacidad.html">Políticas de privacidad</a></li>
                <li><a href="aviso-legal.html">Aviso legal</a></li>
                <li><a href="politicas-de-cookies.html">Políticas de cookies</a></li>
                <li><a href="accesibilidad.html">Accesibilidad</a></li>
            </ul>
        </div>
    </footer>

    <script src="assets/js/login.js"></script>
</body>

</html>
