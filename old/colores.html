<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secuencia de Colores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/color.css"> <!-- Variables -->
    <link rel="stylesheet" href="./assets/css/global.css"> <!-- Estilos globales -->
    <link rel="stylesheet" href="./assets/css/header.css"> <!-- Header -->
    <link rel="stylesheet" href="./assets/css/footer.css"> <!-- Footer -->
    <link rel="stylesheet" href="./assets/css/colores.css"> <!-- Estilos propios de colores -->
    <link rel="stylesheet" href="./assets/css/timer.css"> <!-- timer -->


</head>
<script src="./assets/js/theme.js"></script>

<body>

    <!-- HEADER -->
    <header class="header">
        <button class="theme-toggle" onclick="toggleTheme()">Modo oscuro</button>
        <h1>Secuencia de Colores</h1>
        <p class="subtitle">Observa y repite la secuencia</p>
    </header>
    <p id="timer" class="timer">Tiempo: 0s</p>
    <div class="difficulty-row">
        <label class="difficulty-option">
            <input type="radio" name="difficulty" value="facil">
            Fácil
        </label>

        <label class="difficulty-option">
            <input type="radio" name="difficulty" value="medio" checked>
            Medio
        </label>

        <label class="difficulty-option">
            <input type="radio" name="difficulty" value="dificil">
            Difícil
        </label>
    </div>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="colors-container">

        <section class="panel">
            <div class="color rojo" data-color="rojo" role="button" tabindex="0" aria-label="Color rojo"></div>

            <div class="color azul" data-color="azul" role="button" tabindex="0" aria-label="Color azul"></div>

            <div class="color verde" data-color="verde" role="button" tabindex="0" aria-label="Color verde"></div>

            <div class="color amarillo" data-color="amarillo" role="button" tabindex="0" aria-label="Color amarillo">
            </div>
        </section>

        <br>

        <!-- Botón principal para iniciar la secuencia -->
        <button class="main-btn" id="startBtn">Iniciar juego</button>

    </main>
    <!-- BOTÓN VOLVER Y REINICIAR JUEGO-->
    <div class="text-center mt-4">
        <button id="resetBtn" class="btn btn-warning px-4 py-2">Reiniciar</button>
        <button class="btn btn-secondary px-4 py-2" onclick="location.href='dashboard.html'">Volver</button>
        <!-- FOOTER -->
        <footer class="footer">
            <div class="footer-section">
                <h4>Contactos</h4>
                <ul>
                    <li><a href="contactos.html">Contactos generales</a></li>
                    <li><a href="contactos-medicos.html">Contactos médicos</a></li>
                    <li><a href="faq.html">Preguntas frecuentes</a></li>
                </ul>
            </div>

            <div class="footer-section">
                <h4>Información legal</h4>
                <ul>
                    <li><a href="politicas-de-privacidad.html">Políticas de privacidad</a></li>
                    <li><a href="aviso-legal.html">Aviso legal</a></li>
                    <li><a href="politicas-de-cookies.html">Políticas de cookies</a></li>
                    <li><a href="accesibilidad.html">Accesibilidad</a></li>
                </ul>
            </div>
        </footer>

        <!-- JS -->
        <script src="./assets/js/colores.js"></script>

</body>

</html>
