<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos personales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/color.css"> <!-- Variables -->
    <link rel="stylesheet" href="./assets/css/global.css"> <!-- Estilos globales -->
    <link rel="stylesheet" href="./assets/css/header.css"> <!-- Header -->
    <link rel="stylesheet" href="./assets/css/footer.css"> <!-- Footer -->
    <link rel="stylesheet" href="./assets/css/datos_personales.css"> <!-- Estilos propios de index -->


    <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<script src="./assets/js/theme.js"></script>

<body class="register-body">
    <header>
        <button class="theme-toggle" onclick="toggleTheme()">Modo oscuro</button>
    </header>

    <main class="register-container">

        <div class="register-card">

            <h2>Datos personales</h2>
            <p class="register-subtitle">Completa tu información para continuar</p>

            <!-- Caja de errores -->
            <div id="datos-errors" class="register-errors" style="display:none;"></div>

            <!-- Formulario -->
            <form id="datosForm" class="register-form" action="#" method="POST">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Introduce tu nombre">

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" required placeholder="Introduce tu apellido">

                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 612345678">

                <label for="rol">Selecciona tu rol</label>
                <select id="rol" name="rol" required>
                    <option value="">Selecciona una opción</option>
                    <option value="paciente">Paciente</option>
                    <option value="cuidador">Cuidador</option>
                    <option value="familiar">Familiar</option>
                    <option value="profesional">Profesional de la salud</option>
                </select>

                <button type="submit" class="register-btn">Guardar datos</button>

                <p class="register-login">
                    <a href="index.html">Volver al inicio</a>
                </p>

            </form>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-section">
            <h4>Contactos</h4>
            <ul>
                <li><a href="contactos.html">Contactos generales</a></li>
                <li><a href="contactos-medicos.html">Contactos médicos</a></li>
                <li><a href="faq.html">Preguntas frecuentes</a></li>
            </ul>
        </div>

        <div class="footer-section">
            <h4>Información legal</h4>
            <ul>
                <li><a href="politicas-de-privacidad.html">Políticas de privacidad</a></li>
                <li><a href="aviso-legal.html">Aviso legal</a></li>
                <li><a href="politicas-de-cookies.html">Políticas de cookies</a></li>
                <li><a href="accesibilidad.html">Accesibilidad</a></li>
            </ul>
        </div>
    </footer>

    <script src="./assets/js/datos_personales.js"></script>

</body>

</html>
